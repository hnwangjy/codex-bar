name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Build
      run: >-
        xcodebuild build
        -project codex_bar.xcodeproj
        -scheme codex_bar
        -configuration Debug
        -packageAuthorizationProvider netrc
        -destination 'platform=macOS'
        CODE_SIGNING_ALLOWED=NO

    - name: Run unit tests
      run: >-
        xcodebuild test
        -project codex_bar.xcodeproj
        -scheme codex_bar
        -configuration Debug
        -packageAuthorizationProvider netrc
        -destination 'platform=macOS'
        -only-testing:codex_barTests
        CODE_SIGNING_ALLOWED=NO
